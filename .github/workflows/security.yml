name: SecureVPC Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: IAM Auditor Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pytest

      - name: Run IAM auditor tests
        working-directory: iam-auditor
        run: |
          PYTHONPATH=. pytest -q

  aws-iam-audit:
    name: AWS IAM Audit
    runs-on: ubuntu-latest

    # The IAM trust policy only permits the main branch.
    # Do not run this job for pull requests.
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::021686096322:role/SecureVPC-GitHub-IAMAuditor
          role-session-name: SecureVPC-IAMAuditor

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install auditor dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Run IAM security audit
        working-directory: iam-auditor
        run: |
          python auditor.py
